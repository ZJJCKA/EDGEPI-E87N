name: Build finalized E87N and M87K firmware
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finalized-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync squashfs-tools swig \
            unzip zlib1g-dev file wget nodejs golang-go cmake ninja-build libelf-dev zstd
      - name: Build both public standard images from finalized sources
        run: ./build-finalized.sh j4-standard
      - uses: actions/upload-artifact@v4
        with:
          name: finalized-e87n-m87k-${{ github.sha }}
          path: |
            bin/targets/mediatek/filogic/*-squashfs-sysupgrade.bin
            bin/targets/mediatek/filogic/*.manifest
            bin/targets/mediatek/filogic/sha256sums
            build-both-firmware/*.formal-audit
          if-no-files-found: error
